# Gerador de Conteúdo Kontrul. Rode no servidor `rises`: docker compose up -d --build
services:
  studio-api:
    build: ./backend
    user: "1000:1000" # a chave SSH (0600) pertence ao uid 1000, como no kontrul-api
    restart: unless-stopped
    environment:
      STUDIO_DATABASE_URL: postgresql://sofia:${STUDIO_DB_PASSWORD:?defina STUDIO_DB_PASSWORD no .env}@postgres:5432/sofia
      STUDIO_HERMES_SSH: ${STUDIO_HERMES_SSH:-rises@10.241.168.46}
      STUDIO_HERMES_SSH_KEY: /run/ssh/id_ed25519
      STUDIO_HERMES_CONTAINER: hermes
      STUDIO_COMFY_URL: ${STUDIO_COMFY_URL:-http://10.241.168.46:8188}
      STUDIO_API_KEY: ${STUDIO_API_KEY:-}
    volumes:
      - /home/rises/projects/kontrul/secrets/ssh:/run/ssh:ro
      - studio-media:/data/media  # vinhetas enviadas e vídeos montados
    networks: [kontrul_core]

  studio-web:
    build:
      context: ./frontend
      args:
        VITE_BASE: ${STUDIO_BASE_PATH:-/kontrul-editor/gerador/}   # prefixo em que o app é servido (igual ao do Editor)
    restart: unless-stopped
    depends_on: [studio-api]
    environment:
      STUDIO_API_KEY: ${STUDIO_API_KEY:-}
      STUDIO_BASE_PATH: ${STUDIO_BASE_PATH:-/kontrul-editor/gerador/}
      # Login: reaproveita o do KontrulEditor (auth_request na API dele; contêiner pelo nome, que é único)
      STUDIO_AUTH_URL: ${STUDIO_AUTH_URL:-http://kontrul-editor-api-1:8000/v1/auth/check}
      STUDIO_LOGIN_URL: ${STUDIO_LOGIN_URL:-/kontrul-editor/}
    ports:
      - "${STUDIO_WEB_BIND:-127.0.0.1}:${STUDIO_WEB_PORT:-8795}:80"   # protegida pelo login do Editor (alvo do proxy da VPS)
      - "127.0.0.1:${STUDIO_ADMIN_PORT:-8796}:8081"                    # sem login, só no próprio servidor
    networks: [kontrul_core, kontrul_editor]

volumes:
  studio-media:

networks:
  kontrul_core:
    external: true
  kontrul_editor:
    external: true
    name: kontrul-editor_default   # rede do KontrulEditor, para validar o login
